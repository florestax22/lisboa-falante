services:
  - type: web
    name: lisboa-falante-roberto
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
